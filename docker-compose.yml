version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: civic_voice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicvoice
      POSTGRES_USER: civicvoice
      POSTGRES_PASSWORD: civicvoice123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicvoice -d civicvoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civic_voice_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/civicvoice
      DB_USERNAME: civicvoice
      DB_PASSWORD: civicvoice123
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DDL_AUTO: update
      SERVER_PORT: 8080
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      JWT_SECRET: change_me_to_a_long_random_secret_key_128_plus_bits
      JWT_EXPIRATION_MS: 86400000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - civic_voice_storage:/app/storage

volumes:
  postgres_data:
  civic_voice_storage:
